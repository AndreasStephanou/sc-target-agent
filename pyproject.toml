[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sctarget"
version = "0.1.0"
description = "Agentic target discovery from single-cell / single-nucleus RNA-seq: deterministic analysis tools orchestrated by an auditable LLM tool loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andreas Stephanou" }]
dependencies = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",   # scrublet automatic threshold (detect_doublets falls back without it)
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "anthropic>=0.40",
    "leidenalg>=0.10",
    "igraph>=0.11",
    "markdown>=3.5",
]

[project.optional-dependencies]
full = [
    "pydeseq2>=0.4",
    "harmonypy>=0.0.9",
    "gseapy>=1.1",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
sctarget-run = "scripts.run_pipeline:main"
sctarget-eval = "scripts.run_eval:main"
sctarget-baseline = "scripts.run_baseline:main"
sctarget-synth = "scripts.make_synthetic:main"
sctarget = "scripts.sctarget:main"
sctarget-report = "scripts.collect_results:main"

[tool.setuptools.packages.find]
include = ["sctarget*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning", "ignore::DeprecationWarning"]

# Default pipeline configuration. Copy and edit per dataset; pass with --config.

dataset:
  path: data/synthetic/synthetic.h5ad       # processed AnnData
  species: homo_sapiens                     # homo_sapiens | canis_lupus_familiaris | mus_musculus ...
  sample_key: sample                        # obs column: biological replicate / donor / animal
  condition_key: condition                  # obs column: disease / tissue group
  celltype_key: cell_type                   # obs column with existing annotations (optional, may be null)
  disease: DISEASE                          # condition value that is the disease of interest
  reference: [NORMAL, OTHER_TUMOR]          # condition values to compare against
  counts_layer: counts                      # layer holding raw counts (or null if adata.X is raw)
  human_symbol_var: null                    # optional var column with human ortholog symbols (made once with biomaRt); Ensembl is used for genes it does not cover
  already_processed: true                   # skip QC + integration if true (just reuse existing embeddings/clusters)
  reuse_clustering: null                    # obs column to reuse first (e.g. leiden_1.0); otherwise the first leiden*/louvain* column
  condition_descriptions: {}                # optional: label -> plain-language meaning, shown to the model (e.g. HGIN: healthy gingiva)

analysis:
  qc:
    min_genes: 200
    max_genes: 8000
    max_mt_pct: 10.0
    min_cells_per_gene: 3
  integration:
    batch_key: sample
    use_harmony: true
    n_pcs: 30
    n_neighbors: 15
    resolution: 1.0
  differential_abundance:
    min_cells_per_sample: 20
    enrichment_log2fc: 1.0                  # cluster counts as "disease-specific" above this (2-fold)
    max_mwu_p: 0.05                         # Mann-Whitney on per-sample proportions must be below this (conventional alpha)
  differential_expression:
    method: pseudobulk_deseq2               # pseudobulk_deseq2 | wilcoxon
    padj: 0.05
    min_log2fc: 1.0
    top_n: 200
  enrichment:
    gene_sets: data/fixtures/mini_hallmark.gmt   # path to a .gmt; swap for full MSigDB Hallmark
    padj: 0.05

targets:
  druggable_classes: [KINASE, DRUGGABLE GENOME, CLINICALLY ACTIONABLE, CELL SURFACE, TRANSPORTER, ION CHANNEL, G PROTEIN COUPLED RECEPTOR]
  min_specificity_log2fc: 1.0               # disease-state vs all other states
  top_k_report: 15
  exclude_gene_patterns: null               # regexes for genes never nominated (default: ENS*G ids, LOC*, MT-, RPL/RPS, snoRNA/miRNA/lincRNA)
  weights:                                  # scoring weights, sum ~1
    effect_size: 0.25
    specificity: 0.25
    druggability: 0.25
    known_compounds: 0.15
    consistency_across_samples: 0.10

agent:
  model: claude-sonnet-4-5
  max_turns_per_role: 40
  temperature: 0.2
  seed: 0

privacy:
  max_list_items: 100                       # longest list a tool may return to the model
  max_table_rows: 60
  pseudonymize_samples: true
  forbidden_obs_columns: [patient_id, donor_id, mrn, name, dob, date_of_birth]

output:
  run_dir: runs

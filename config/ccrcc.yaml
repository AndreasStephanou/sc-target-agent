dataset:
  path: data/ccrcc/ccrcc.h5ad
  species: homo_sapiens                  # no ortholog step
  sample_key: sample                     # GSM library (patient SS_2014 contributes cortex + medulla as two benign libraries)
  condition_key: condition
  celltype_key: author_celltype          # the authors' annotation when attached; set analysis.lineages.ignore_annotation: true to run annotation-free
  disease: ccRCC
  reference: [Benign]
  condition_descriptions:
    ccRCC: "clear cell renal cell carcinoma (primary tumour)"
    Benign: "benign adjacent kidney (cortex / medulla) from nephrectomies"
  counts_layer: counts
  already_processed: false               # filtered 10x matrices: run QC, recompute embedding + clustering
  reuse_clustering: null
  forbidden_obs_columns: [sex, library]
analysis:
  lineages:
    ignore_annotation: false             # flip to true for the annotation-free arm
targets:
  objective: target
  scoring_version: 2
agent:
  max_turns_per_role: 60

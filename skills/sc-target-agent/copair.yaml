name: sc-target-agent
domain: genomics
status: experimental
version: 0.4.2

maintainers:
  - "Andreas Stephanou (@AndreasStephanou)"

tested_with:
  - Claude Code CLI (claude-code backend, subscription login), sc-target-agent tags results-v1 and results-v3 (ovarian reviewer run, three agent runs)
  - Claude API (claude-sonnet-4-5 via AnthropicModel), sc-target-agent tags prompts-v2 / scoring-v2
  - Scripted deterministic backend (no model; calibration arm), sc-target-agent tags results-v1, results-v2 (HCC reviewer run) and results-v3 (ovarian reviewer run)
  - "0.4 round (tag results-v4): skill-driven end-to-end runs on two new designs, IPF vs control lung (GSE135893, non-malignant) and doxorubicin vs vehicle mouse heart (GSE285475, perturbation, marker mode), plus a ccRCC regression pair; prompts v8, scoring v3"
  - "0.4b round (tag results-v5): the three earlier tumour datasets re-run under the 0.4 skill (HCC rebuilt from GEO, ovarian rebuilt from GEO, fibrolamellar carcinoma snRNA-seq); 7 floors and 7 agent runs; prompts v9-v11; helper scripts run before every run"

environments:
  - conda environment sctarget (environment.yml in the sc-target-agent repository)
  - Cornell BioHPC workdir (Linux); any Linux/macOS machine with conda should work

dependencies:
  - conda
  - sc-target-agent repository (https://github.com/AndreasStephanou/sc-target-agent), tag results-v5 or later (protocol 23-23l; design_check / label_check, subcluster(condition=...))
  - Claude Code CLI (logged in) or ANTHROPIC_API_KEY, for the agent run only
  - network access to DGIdb, Open Targets and PubMed (gene-level lookups; offline mode exists for the demo)
  - "helper scripts: anndata, h5py, numpy, pandas, scipy (all in the sctarget environment)"

data_policy:
  allowed_test_data: public-or-synthetic
  notes: >-
    Evaluation cases use the public GSE159115 ccRCC, GSE149614 HCC and GSE286057 ovarian datasets, a synthetic dataset
    generated by the repository, and fabricated reasoning cases (03, 06, 07) with no real data. The canine ameloblastoma
    dataset used in development is unpublished and is described only by summary results. The pipeline's privacy guard
    blocks per-cell matrices and real sample identifiers from reaching the model; cluster-level tables, marker lists and
    gene symbols are sent to Anthropic (via Claude Code or the API) and gene symbols are sent to DGIdb, Open Targets and
    NCBI E-utilities. The helper scripts send nothing anywhere.

last_validated: "2026-11-05"
